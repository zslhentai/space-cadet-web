<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141b26">
  <title>3D Pinball · Space Cadet</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <header class="titlebar"><span class="badge" aria-hidden="true">✦</span><div><h1>3D Pinball <span>SPACE CADET</span></h1><p>经典弹珠 · 原版引擎 Web 移植</p></div><button id="fullscreen" title="全屏" aria-label="切换全屏">⛶</button></header>
  <nav class="toolbar" aria-label="游戏工具">
    <button id="pause" disabled>暂停</button><button id="restart" disabled>重开</button><button id="scores" disabled>排行榜</button>
    <label class="volume">音量 <input id="volume" aria-label="音量" type="range" min="0" max="100" value="70"></label>
  </nav>
  <div class="readout"><span id="status" role="status">等待导入游戏资源</span><span>本机最高分 <strong id="best">0</strong></span></div>
  <section id="stage" aria-label="弹珠游戏区域">
    <canvas id="canvas" width="600" height="416" tabindex="0" aria-label="Space Cadet 弹珠台"></canvas>
    <div id="touch-zones" hidden><div data-action="0" aria-label="左半屏控制左挡板"></div><div data-action="1" aria-label="右半屏控制右挡板"></div></div>
    <div id="resource-panel">
      <span class="eyebrow">SPACE CADET / 1995</span>
      <h2>让经典再次启动</h2>
      <p>使用你合法持有的原版文件。<br>资源在浏览器本地读取，不会上传。</p>
      <label class="file-button">选择游戏资源<input id="files" type="file" multiple accept=".dat,.bin,.wav,.mid,.sf2" aria-label="选择合法游戏资源"></label>
      <p class="file-hint">必需：PINBALL.DAT · PB_MSGFT.BIN<br>音效：原版目录中的全部 WAV<br>音乐（可选）：PINBALL.MID · 合法的 GM.SF2</p>
      <p id="resource-status" role="status">PB_MSGFT.BIN 的提取方法见运行说明。</p>
      <button id="start" disabled>启动原版游戏</button>
    </div>
    <div id="pause-cover" hidden><p>游戏已暂停</p><button id="resume">继续游戏</button></div>
  </section>
  <div id="controls" aria-label="触屏操作">
    <button data-action="0" disabled><span>左挡板</span><small>Z / ←</small></button>
    <button id="launch" data-action="2" disabled><span>按住蓄力</span><small>松开发射 · 空格</small></button>
    <button data-action="1" disabled><span>右挡板</span><small>/ / →</small></button>
  </div>
  <footer><span>左右半屏可同时按住 · X / . / ↑ 晃动球台</span><a href="./README.html" target="_blank" rel="noopener">运行说明</a></footer>
</main>
<dialog id="restart-confirm"><form method="dialog"><h2>重新开始？</h2><p>当前这一局将结束，已保存的最高分会保留。</p><div><button value="cancel">继续这一局</button><button value="restart">开始新一局</button></div></form></dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
